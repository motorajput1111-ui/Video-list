<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZZZ Video Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
    font-family:system-ui, Arial, sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    transition:background 0.8s ease;
}

/* ===== CHARACTER BACKGROUNDS ===== */

body.yixuan{
    background:
        radial-gradient(circle at 20% 30%, rgba(0,180,255,0.35), transparent 40%),
        linear-gradient(120deg,#061a2d,#0b3c5d,#061a2d);
    background-size:200% 200%;
    animation:bgMove 12s ease-in-out infinite;
}

body.yidhari{
    background:
        radial-gradient(circle at 20% 30%, rgba(180,0,255,0.35), transparent 40%),
        linear-gradient(120deg,#1a002a,#3a005c,#1a002a);
    background-size:200% 200%;
    animation:bgMove 12s ease-in-out infinite;
}

body.jane{
    background:
        radial-gradient(circle at 20% 30%, rgba(255,0,70,0.35), transparent 40%),
        linear-gradient(120deg,#120012,#2b0018,#120012);
    background-size:200% 200%;
    animation:bgMove 12s ease-in-out infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ===== LAYOUT ===== */

.wrapper{
    width:95%;
    max-width:900px;
}

h2{
    text-align:center;
    margin-bottom:16px;
    font-weight:400;
    letter-spacing:1px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin-bottom:20px;
}

.card{
    background:rgba(255,255,255,0.08);
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-6px);
    box-shadow:0 0 20px rgba(255,255,255,0.35);
}

.card img{
    width:100%;
    height:140px;
    object-fit:cover;
}

.card .name{
    padding:12px;
    text-align:center;
    font-size:18px;
}

.player-box{
    background:rgba(255,255,255,0.1);
    padding:15px;
    border-radius:18px;
}

#videoTitle{
    text-align:center;
    margin-bottom:10px;
}

video{
    width:100%;
    border-radius:14px;
    background:black;
}
</style>
</head>

<body class="jane"><!-- default background -->

<div class="wrapper">

<h2>Choose Your Agent 🎮</h2>

<div class="cards">

<div class="card" onclick="playVideo(
'YiXuan',
'https://raw.githubusercontent.com/YOUR_USERNAME/video-gallery/main/YiXuan.mp4',
'https://raw.githubusercontent.com/YOUR_USERNAME/video-gallery/main/thumb-yixuan.jpg',
'yixuan'
)">
<img src="https://raw.githubusercontent.com/YOUR_USERNAME/video-gallery/main/thumb-yixuan.jpg">
<div class="name">YiXuan</div>
</div>

<div class="card" onclick="playVideo(
'Yidhari',
'https://raw.githubusercontent.com/YOUR_USERNAME/video-gallery/main/Yidhari.mp4',
'https://raw.githubusercontent.com/YOUR_USERNAME/video-gallery/main/thumb-yidhari.jpg',
'yidhari'
)">
<img src="https://raw.githubusercontent.com/YOUR_USERNAME/video-gallery/main/thumb-yidhari.jpg">
<div class="name">Yidhari</div>
</div>

<div class="card" onclick="playVideo(
'Jane Doe',
'https://raw.githubusercontent.com/YOUR_USERNAME/video-gallery/main/JaneDoe.mp4',
'https://raw.githubusercontent.com/YOUR_USERNAME/video-gallery/main/thumb-jane.jpg',
'jane'
)">
<img src="https://raw.githubusercontent.com/YOUR_USERNAME/video-gallery/main/thumb-jane.jpg">
<div class="name">Jane Doe</div>
</div>

</div>

<div class="player-box">
<h3 id="videoTitle">Select a card to play</h3>
<video id="player" controls playsinline></video>
</div>

</div>

<script>
function playVideo(title, src, poster, theme){
    const v = document.getElementById("player");
    const t = document.getElementById("videoTitle");

    // change background
    document.body.className = theme;

    // load video
    t.innerText = title;
    v.pause();
    v.src = src;
    v.poster = poster;
    v.load();
}
</script>

</body>
</html>
