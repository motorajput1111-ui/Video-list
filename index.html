<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Player</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1b0010, #4b1230);
    transition: background 0.5s ease;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .app {
    width: 95%;
    max-width: 420px;
  }

  .card {
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }

  .card:hover {
    transform: scale(1.02);
  }

  .thumb {
    width: 100%;
    height: 180px;
    border-radius: 12px;
    object-fit: cover;
    margin-bottom: 10px;
  }

  .name {
    text-align: center;
    color: #fff;
    font-size: 20px;
    font-weight: 600;
  }

  .player {
    display: none;
  }

  video {
    width: 100%;
    border-radius: 16px;
    background: black;
  }
</style>
</head>

<body>

<div class="app">

  <!-- YiXuan -->
  <div class="card" onclick="playVideo('videos/yixuan.mp4', 'yixuan')">
    <img class="thumb" src="thumbs/yixuan.jpg">
    <div class="name">YiXuan</div>
  </div>

  <!-- Yidhari -->
  <div class="card" onclick="playVideo('videos/yidhari.mp4', 'yidhari')">
    <img class="thumb" src="thumbs/yidhari.jpg">
    <div class="name">Yidhari</div>
  </div>

  <!-- Jane Doe -->
  <div class="card" onclick="playVideo('videos/jane.mp4', 'jane')">
    <img class="thumb" src="thumbs/jane.jpg">
    <div class="name">Jane Doe</div>
  </div>

  <!-- Player -->
  <div class="player" id="playerBox">
    <video id="video" controls autoplay></video>
  </div>

</div>

<script>
function playVideo(src, character) {
  const video = document.getElementById("video");
  const box = document.getElementById("playerBox");

  video.src = src;
  box.style.display = "block";
  video.play();

  if (character === "jane") {
    document.body.style.background =
      "linear-gradient(135deg, #20000a, #7a1c2f)";
  }
  if (character === "yixuan") {
    document.body.style.background =
      "linear-gradient(135deg, #001b2e, #004466)";
  }
  if (character === "yidhari") {
    document.body.style.background =
      "linear-gradient(135deg, #1b0020, #5b2a6e)";
  }
}
</script>

</body>
</html>
